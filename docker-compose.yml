services:
  postgres:
    image: postgres:16-alpine
    container_name: users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usersdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: users-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: usersdb
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: changeme_secret
      DB_MAX_RETRIES: 10
      DB_RETRY_INTERVAL: 5
      APP_PORT: ":8000"
      BROKER_TYPE: "RABBITMQ"
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USERNAME: ${RABBIT_USERNAME:-billing}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-billing}
      RABBIT_AUTH_PRODUCE_EXCHANGE: "auth"
      RABBIT_AUTH_PRODUCE_RK: "user.created"
      CONFIRM_BASE_URL: "http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: